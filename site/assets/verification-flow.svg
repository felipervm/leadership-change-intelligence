<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Classify first. Verify by change type.</title><desc id="desc">An original conceptual workflow connecting an announcement to status-change, new-role and membership-addition checks, followed by a sourced review record.</desc><rect width="1200" height="380" fill="#111b2d"/><g font-family="Arial,sans-serif"><text x="40" y="40" fill="#b9dfc4" font-size="11" letter-spacing="2">ORIGINAL WORKFLOW / A PROPOSAL TO TEST</text><g stroke="#77999f" fill="none" stroke-width="1.5"><path d="M275 190H345V100H400M345 190H400M345 190V280H400M755 100H820V190H890M755 190H890M755 280H820V190"/></g><g fill="#1b2c43" stroke="#65838e"><rect x="40" y="135" width="235" height="110"/><rect x="400" y="63" width="355" height="74"/><rect x="400" y="153" width="355" height="74"/><rect x="400" y="243" width="355" height="74"/><rect x="890" y="115" width="270" height="150" stroke="#b9dfc4"/></g><g fill="#f5f7fa" font-size="19" font-weight="bold"><text x="62" y="176">Public announcement</text><text x="420" y="93">Status change</text><text x="420" y="183">New role</text><text x="420" y="273">Membership addition</text><text x="913" y="152">Sourced review record</text></g><g fill="#b4c6d4" font-size="14"><text x="62" y="204">Retain the claim, date</text><text x="62" y="225">and official source.</text><text x="420" y="117">Compare appointment qualifiers.</text><text x="420" y="207">Confirm organizational context.</text><text x="420" y="297">Check membership and chair status.</text><text x="913" y="184">Preserve the evidence.</text><text x="913" y="209">Keep unverified dates unknown.</text><text x="913" y="234">Route unresolved questions.</text></g><text x="40" y="350" fill="#9aafbd" font-size="11">CONCEPTUAL DIAGRAM / NO VERIFIED REPORTING EDGES OR MEASURED PERFORMANCE CLAIMS</text></g></svg>
